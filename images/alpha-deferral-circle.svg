<svg xmlns="http://www.w3.org/2000/svg" width="960" height="745" viewBox="0 0 960 745" role="img" aria-labelledby="title desc">
  <title id="title">The circle of deferral</title>
  <desc id="desc">Six actors — operator, vendor, regulator, certifier, insurer, and court — arranged in a circle around the safety threshold alpha, each deferring the choice to the next. If no one chooses alpha, the accident chooses it.</desc>
  <defs>
    <marker id="arrSolid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="960" height="745" rx="18" fill="#ffffff"/>

  <text x="480" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">The circle of deferral</text>

  <!-- clockwise deferral arcs (R=230, center 480,390) -->
  <path d="M 543 169 A 230 230 0 0 1 640 225" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>
  <path d="M 703 334 A 230 230 0 0 1 703 446" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>
  <path d="M 640 555 A 230 230 0 0 1 543 611" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>
  <path d="M 417 611 A 230 230 0 0 1 320 555" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>
  <path d="M 257 446 A 230 230 0 0 1 257 334" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>
  <path d="M 320 225 A 230 230 0 0 1 417 169" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arrSolid)"/>

  <!-- dashed arrows toward the center -->
  <line x1="480" y1="260" x2="480" y2="284" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>
  <line x1="593" y1="325" x2="572" y2="337" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>
  <line x1="593" y1="455" x2="572" y2="443" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>
  <line x1="480" y1="520" x2="480" y2="496" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>
  <line x1="367" y1="455" x2="388" y2="443" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>
  <line x1="367" y1="325" x2="388" y2="337" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrDash)"/>

  <!-- center -->
  <circle cx="480" cy="390" r="100" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="368" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="600" fill="#111827">Safety threshold</text>
  <text x="480" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" font-style="italic" fill="#111827">&#945;</text>
  <text x="480" y="444" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">who signs it?</text>

  <!-- 1 Operator (top) -->
  <circle cx="480" cy="180" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="480" cy="132" r="13" fill="#4b5563"/>
  <text x="480" y="136.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="480" y="168" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Operator</text>
  <text x="480" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;Just tell me</text>
  <text x="480" y="210" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">it is safe.&#8221;</text>

  <!-- 2 Vendor (upper right) -->
  <circle cx="662" cy="285" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="662" cy="237" r="13" fill="#4b5563"/>
  <text x="662" y="241.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="662" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Vendor</text>
  <text x="662" y="297" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;Give us</text>
  <text x="662" y="315" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">the number.&#8221;</text>

  <!-- 3 Regulator (lower right) -->
  <circle cx="662" cy="495" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="662" cy="447" r="13" fill="#4b5563"/>
  <text x="662" y="451.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="662" y="483" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Regulator</text>
  <text x="662" y="507" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;Process,</text>
  <text x="662" y="525" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">not numbers.&#8221;</text>

  <!-- 4 Certifier (bottom) -->
  <circle cx="480" cy="600" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="480" cy="552" r="13" fill="#4b5563"/>
  <text x="480" y="556.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="480" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Certifier</text>
  <text x="480" y="612" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;We audit</text>
  <text x="480" y="630" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">the process.&#8221;</text>

  <!-- 5 Insurer (lower left) -->
  <circle cx="298" cy="495" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="298" cy="447" r="13" fill="#4b5563"/>
  <text x="298" y="451.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="298" y="483" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Insurer</text>
  <text x="298" y="507" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;We price what</text>
  <text x="298" y="525" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">we can see.&#8221;</text>

  <!-- 6 Court (upper left) -->
  <circle cx="298" cy="285" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="298" cy="237" r="13" fill="#4b5563"/>
  <text x="298" y="241.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="298" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Court</text>
  <text x="298" y="297" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">&#8220;We decide</text>
  <text x="298" y="315" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">afterward.&#8221;</text>

  <text x="480" y="712" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-style="italic" fill="#374151">If no one chooses &#945;, the accident chooses it.</text>
</svg>
